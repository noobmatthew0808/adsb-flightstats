name: Publish verified release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Verify tag and package
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python scripts/build-release.py
      - name: Publish packaged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.sha256 --verify-tag --generate-notes
